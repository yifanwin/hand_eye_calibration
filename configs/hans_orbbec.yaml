schema_version: 1
robot:
  factory: hand_eye_calibration.adapters.robots.hans_cps:HansCPSAdapter
  options:
    host: 192.168.156.2
    port: 10003
    cps_module: utils.CPS
    tcp_name: TCP
    ucs_name: Base
    speed_percent: 15.0
camera:
  factory: hand_eye_calibration.adapters.cameras.orbbec:OrbbecAdapter
  options: {}
  streams:
    color: {width: 1920, height: 1080, fps: 30, format: MJPG}
    depth: {width: 640, height: 360, fps: 30, format: Y16}
target:
  factory: hand_eye_calibration.detectors.checkerboard:ChessboardDetector
  options:
    columns: 11
    rows: 8
    square_size_m: 0.01
collection:
  trajectory: data/trajectories/hans.yaml
  rounds: 3
  settle_time_s: 1.0
  save_images: true
solver:
  method: park
validation:
  min_observations: 10
  min_max_relative_rotation_deg: 15.0
  min_rotation_axis_rank: 2
  reprojection_median_px: 1.0
  reprojection_p95_px: 2.0
  target_translation_rms_mm: 5.0
  target_rotation_rms_deg: 0.5
  translation_span_m: 0.1
  rotation_span_deg: 30.0
output_root: data
