schema_version: 1
robot:
  factory: hand_eye_calibration.adapters.robots.franka:FrankaRobotAdapter
  options:
    host: 172.16.0.2
    relative_dynamics_factor: 0.05
    base_frame: base
    ee_frame: end_effector
camera:
  factory: hand_eye_calibration.adapters.cameras.realsense:RealSenseAdapter
  options:
    serial_number: ""
    expected_name_contains: D435
  streams:
    color: {width: 1280, height: 720, fps: 30, format: bgr8}
    depth: {width: 640, height: 480, fps: 30, format: z16}
target:
  factory: hand_eye_calibration.detectors.checkerboard:ChessboardDetector
  options:
    columns: 11
    rows: 8
    square_size_m: 0.01
collection:
  trajectory: data/trajectories/fr3.yaml
  rounds: 3
  settle_time_s: 1.0
  save_images: true
solver:
  method: park
validation:
  min_observations: 10
  min_max_relative_rotation_deg: 15.0
  min_rotation_axis_rank: 2
  reprojection_median_px: 1.0
  reprojection_p95_px: 2.0
  target_translation_rms_mm: 5.0
  target_rotation_rms_deg: 0.5
  translation_span_m: 0.1
  rotation_span_deg: 30.0
output_root: data
